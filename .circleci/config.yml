version: 2.1

jobs:
  build:
    docker:
      - image: cimg/openjdk:21.0

    steps:
      - checkout

      - restore_cache:
          keys:
            - maven-deps-{{ checksum "pom.xml" }}
            - maven-deps-

      - run:
          name: Install dependencies and build
          command: mvn clean install -DskipTests

      - save_cache:
          paths:
            - ~/.m2
          key: maven-deps-{{ checksum "pom.xml" }}

      - persist_to_workspace:
          root: .
          paths:
            - target/*.jar

  test:
    docker:
      - image: cimg/openjdk:21.0

    steps:
      - checkout

      - restore_cache:
          keys:
            - maven-deps-{{ checksum "pom.xml" }}
            - maven-deps-

      - run:
          name: Run tests
          command: mvn test

      - store_test_results:
          path: target/surefire-reports

      - store_artifacts:
          path: target/surefire-reports

workflows:
  build_test:
    jobs:
      - build
      - test:
          requires:
            - build